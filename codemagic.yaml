workflows:
  ios-swift-workflow:
    name: iOS Swift Build
    max_build_duration: 60
    environment:
      vars:
        APP_NAME: "Ornix"
        APP_BUNDLE_ID: "com.romfeminineantic.ornix" # 替换成你的 App Bundle ID
        APP_VERSION: "1.0.0" # 可以根据需要修改
        APP_BUILD_NUMBER: "1"
        APPLE_DEVELOPER_TEAM_ID: "V46R39MCS2" # 你提供的可能是团队 ID
        APPLE_CERTIFICATE_UUID: "225183eb-288e-4318-be45-c85141f06d80" # UUID
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          pod install --repo-update
      - name: Build app
        script: |
          xcodebuild -workspace Ornix.xcworkspace \
                     -scheme Ornix \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath $CM_BUILD_DIR/Ornix.xcarchive archive \
                     DEVELOPMENT_TEAM=$APPLE_DEVELOPER_TEAM_ID
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
                     -archivePath $CM_BUILD_DIR/Ornix.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $CM_BUILD_DIR
    artifacts:
      - $CM_BUILD_DIR/*.ipa
