workflows:
  ios-release:
    name: Ornix Swift iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Ornix
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.romfeminineantic.ornix
      vars:
        APP_ID: 6757517049 # <-- 你的 App Store Connect APP ID
        APP_VERSION: 1.0.0  # 你的主版本号
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods
        script: |
          echo "Installing CocoaPods..."
          brew install cocoapods || true
          pod install

      - name: Get latest TestFlight build number and update Info.plist
        script: |
          echo "Fetching latest TestFlight build number..."
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_ID")
          NEXT_BUILD=$((LATEST_BUILD + 1))
          echo "Next build number: $NEXT_BUILD"

          INFO_PLIST_PATH="Ornix/Info.plist" # 修改为你项目 Info.plist 路径
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD" "$INFO_PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$INFO_PLIST_PATH"
          echo "Info.plist updated with build $NEXT_BUILD and version $APP_VERSION"

      - name: Build and Archive IPA
        script: |
          echo "Building Xcode archive..."
          xcodebuild -workspace Ornix.xcworkspace \
                     -scheme Ornix \
                     -sdk iphoneos \
                     -configuration Release \
                     archive \
                     -archivePath $CM_BUILD_DIR/Ornix.xcarchive

      - name: Export IPA
        script: |
          echo "Exporting IPA..."
          xcodebuild -exportArchive \
                     -archivePath $CM_BUILD_DIR/Ornix.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath $CM_BUILD_DIR
                     
      - name: Upload IPA to TestFlight
        script: |
          echo "Uploading IPA to TestFlight..."
          app-store-connect upload --ipa $CM_BUILD_DIR/*.ipa --app-id $APP_ID

    artifacts:
      - $CM_BUILD_DIR/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your@email.com
